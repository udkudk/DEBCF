name: Repository Wiki TOC & Heading Numbering Automation

on:
  gollum: # This triggers the workflow every single time someone edits a Wiki page directly on GitHub!
  workflow_dispatch: # Lets you run the workflow manually from the Actions tab.
  push:
    branches:
      - main # Triggers if you push changes directly to your main code branch

permissions:
  contents: write # Grants permissions to update the Wiki repository directly

env:
  # Resolves error 2: Forces actions to use Node 24 natively and clears the deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  wiki-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Wiki Repository
        uses: actions/checkout@v5
        with:
          # Targets your hidden secondary Wiki repository instead of code files
          repository: ${{ github.repository }}.wiki 
          path: wiki-repo

      - name: Generate Header Numbers and TOC via Native Node Tools
        run: |
          cd wiki-repo
          
          # 1- NATIVE BASH HEADER NUMBERING MODULE (6 LAYERS)
          for file in *.md; do
            if [[ "$file" != "_*" && "$file" != "_Sidebar.md" && -f "$file" ]]; then
              echo "Applying decimal header numbering to: $file"
              
              # Initialize structural counter depths starting at H1 all the way down to H6
              c1=0; c2=0; c3=0; c4=0; c5=0; c6=0
              
              # Read the file line by line, parse headings, and write to a temporary file
              while IFS= read -r line || [ -n "$line" ]; do
                
                # 🔍 Catches # all the way down to ######
                if [[ "$line" =~ ^(#+)[[:space:]](.*) ]]; then
                  hashes="${BASH_REMATCH[1]}"
                  title="${BASH_REMATCH[2]}"
                  
                  # Clean off any previously injected numbering sequences (e.g. "1.2.3. Text")
                  title=$(echo "$title" | sed -E 's/^[0-9]+(\.[0-9]+)*\.?[[:space:]]+//')
                  
                  depth=${#hashes}
                  
                  # Adjust counters sequentially based on heading depth
                  if [ "$depth" -eq 1 ]; then
                    ((c1++)); c2=0; c3=0; c4=0; c5=0; c6=0
                    numbering="$c1."
                  elif [ "$depth" -eq 2 ]; then
                    ((c2++)); c3=0; c4=0; c5=0; c6=0
                    numbering="$c1.$c2."
                  elif [ "$depth" -eq 3 ]; then
                    ((c3++)); c4=0; c5=0; c6=0
                    numbering="$c1.$c2.$c3."
                  elif [ "$depth" -eq 4 ]; then
                    ((c4++)); c5=0; c6=0
                    numbering="$c1.$c2.$c3.$c4."
                  elif [ "$depth" -eq 5 ]; then
                    ((c5++)); c6=0
                    numbering="$c1.$c2.$c3.$c4.$c5."
                  elif [ "$depth" -eq 6 ]; then
                    ((c6++))
                    numbering="$c1.$c2.$c3.$c4.$c5.$c6."
                  fi
                  
                  # Output the rebuilt, perfectly numbered header line
                  echo "$hashes $numbering $title" >> "$file.tmp"
                else
                  echo "$line" >> "$file.tmp"
                fi
              done < "$file"
              
              mv "$file.tmp" "$file"
            fi
          done

          # 2- Loop through files a second time to parse those newly numbered headers into the TOC
          # Uses npx to run markdown-toc safely without a marketplace action wrapper
          # It updates every markdown file in place (-i) matching your placeholder
          # Resolves error 1: Added '-y' to npx to skip the interactive installer block
          # 🛠️ THE CRASH FIX: Loop through each markdown file individually. 
          # The "|| true" statement forces the script to ignore empty wiki pages instead of crashing!
          for file in *.md; do
            if [ -f "$file" ]; then
              echo "Processing Table of Contents for: $file"
              # 🏷️ Added global heading exclusions using the --ignore flag
              npx -y markdown-toc -i "$file" --ignore "Introduction|License|Table of Contents" || true
            fi
          done

      - name: Automatically Build Global TOC for _Sidebar.md
        run: |
          cd wiki-repo
          
          # Start with a clean sidebar header
          echo "### 🗺️ Navigation" > _Sidebar.md
          echo "" >> _Sidebar.md
          
          # Loop through all markdown files and extract clean link titles
          for file in *.md; do
            # Ignore hidden files, the sidebar itself, and Home page (handled below)
            # ⏬ "$file" != "_*" means it COMPLETELY IGNORES "_Sidebar.md" automatically!
            
            if [[ "$file" != "_*" && "$file" != "Home.md" && "$file" != "_Sidebar.md" && -f "$file" ]]; then
              name="${file%.md}"
              
              # Optional: Skip specific header file names using the pipe separator
              if [[ "$name" =~ ^(Introduction|License|Table of Contents|_Sidebar)$ ]]; then
                echo "Skipping sidebar link for: $file"
                continue
              fi

              # Replaces hyphens with spaces for a cleaner display title
              display_name=$(echo "$name" | tr '-' ' ')
              echo "* [[$display_name|$name]]" >> _Sidebar.md
            fi
          done
          
          # Always pin Home to the top of your links
          if [ -f "Home.md" ]; then
            sed -i "2i * [[Home]]" _Sidebar.md
          fi

      - name: Commit and Push Changes back to Wiki Webpage
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only push if changes were actually made to headings
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "docs: auto-generate table of contents"
            git push
          else
            echo "No heading updates found. Skipping push."
          fi
