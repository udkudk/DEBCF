name: Repository Wiki TOC & Heading Numbering Automation

on:
  gollum: # This triggers the workflow every single time someone edits a Wiki page directly on GitHub!
  workflow_dispatch: # Lets you run the workflow manually from the Actions tab.
  push:
    branches:
      - main # Triggers if you push changes directly to your main code branch

permissions:
  contents: write # Grants permissions to update the Wiki repository directly

env:
  # Resolves error 2: Forces actions to use Node 24 natively and clears the deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
  # Add or remove ignored headings here separated by a pipe | - Define the exact headings we want to skip numbering, TOC and ignore completely
  GLOBAL_IGNORED_HEADINGS: "Introduction|License|Table of Contents"

jobs:
  wiki-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Wiki Repository
        uses: actions/checkout@v5
        with:
          # Targets your hidden secondary Wiki repository instead of code files
          repository: ${{ github.repository }}.wiki 
          path: wiki-repo

      - name: Generate Header Numbers, TOC, and Repair Global Cross-Page Links (6 LAYERS of Headers), also PREPARES LATEX HEADINGS FOR THE TOC
        run: |
          cd wiki-repo
          
          # 🎮 CREATE A COMPREHENSIVE OMNISCIENT CROSS-REFERENCE ENGINE
          cat << 'EOF' > parse-headings.js
          const fs = require('fs');
          const path = require('path');

          const files = fs.readdirSync('.').filter(f => f.endsWith('.md') && !f.startsWith('_'));
          const ignoredHeadings = process.env.GLOBAL_IGNORED_HEADINGS.split('|');

          // Helper function to simulate GitHub's native anchor slug generation logic
          // STRIP LATEX MATH STRINGS TEMPORARILY JUST FOR BLANK/IGNORE CHECKS
          function slugify(text) {
            return text
              .toLowerCase()
              .replace(/\$\$/g, '')
              .replace(/\\textcolor\{[a-zA-Z]+\}/g, '')
              .replace(/\\space/g, '')
              .replace(/\\&/g, '')
              .replace(/[\{\}]/g, '')
              .replace(/[^a-z0-9\s-]/g, '') // Remove special characters
              .trim()
              .replace(/[\s_]+/g, '-')      // Convert spaces/underscores to hyphens
              .replace(/-+/g, '-');         // Deduplicate multiple hyphens
          }

          // Global map object tracking: { 'Page-Name#old-slug': 'Page-Name#new-slug' }
          let globalLinkMaps = {};

          // ==========================================
          // PASS 1: SCAN ALL FILES & POPULATE CROSS-REFERENCE DATABASE
          // ==========================================
          files.forEach(file => {
            try {
              let content = fs.readFileSync(file, 'utf8');
              let lines = content.split(/\r?\n/);
              let counters = new Array(6).fill(0); 
              const pageName = path.basename(file, '.md');

              lines.forEach(line => {
                const match = line.match(/^(#{1,6})[ \t]+(.*)$/);
                if (match) {
                  const hashes = match.at(1);
                  let title = match.at(2).trim();

                  // Clean off any old numbering sequences to compute the pure original slug (e.g., 1.2.3.)
                  let pureTitle = title.replace(/^[0-9]+(\.[0-9]+)*\.?[ \t]+/, '');
                  let oldSlug = slugify(pureTitle);

                  // STRIP LATEX MATH STRINGS TEMPORARILY JUST FOR BLANK/IGNORE CHECKS
                  let plainText = pureTitle
                    .replace(/\$\$/g, '')
                    .replace(/\\textcolor\{[a-zA-Z]+\}/g, '')
                    .replace(/\\space/g, '')
                    .replace(/\\&/g, '')
                    .replace(/[\{\}]/g, '')
                    .trim();

                  if (plainText === '' || ignoredHeadings.some(ignored => plainText.toLowerCase() === ignored.toLowerCase())) {
                    return; 
                  }

                  const depth = hashes.length;
                  counters.map((val, idx) => {
                    if (idx === depth - 1) counters.splice(idx, 1, val + 1);
                    else if (idx >= depth) counters.splice(idx, 1, 0);
                  });

                  let numbering = counters.slice(0, depth).join('.') + '.';
                  let newSlug = slugify(`${numbering} ${pureTitle}`);

                  // Map explicit global cross-file references cleanly
                  globalLinkMaps[`${pageName}#${oldSlug}`] = `${pageName}#${newSlug}`;
                  
                  // Handle cases where cross-references use spaces instead of hyphens
                  const spacedPageName = pageName.replace(/-/g, ' ');
                  globalLinkMaps[`${spacedPageName}#${oldSlug}`] = `${pageName}#${newSlug}`;
                }
              });
            } catch (err) {
              console.error(`Error mapping headings for file ${file}:`, err.message);
            }
          });

          // ==========================================
          // PASS 2: APPLY NUMBERS & EXECUTE GLOBAL REWRITES
          // ==========================================
          files.forEach(file => {
            try {
              let content = fs.readFileSync(file, 'utf8');
              let lines = content.split(/\r?\n/);
              let counters = new Array(6).fill(0); 
              const pageName = path.basename(file, '.md');

              // Create a local-only slice subset map to handle inner-file links safely
              let localFileMap = {};
              
              lines.forEach(line => {
                const match = line.match(/^(#{1,6})[ \t]+(.*)$/);
                if (match) {
                  const hashes = match.at(1);
                  let title = match.at(2).trim();
                  let pureTitle = title.replace(/^[0-9]+(\.[0-9]+)*\.?[ \t]+/, '');
                  let oldSlug = slugify(pureTitle);
                  
                  // STRIP LATEX MATH STRINGS TEMPORARILY JUST FOR BLANK/IGNORE CHECKS
                  let plainText = pureTitle.replace(/\$\$/g, '').replace(/\\textcolor\{[a-zA-Z]+\}/g, '').replace(/\\space/g, '').replace(/\\&/g, '').replace(/[\{\}]/g, '').trim();
                  if (plainText === '' || ignoredHeadings.some(ignored => plainText.toLowerCase() === ignored.toLowerCase())) return;

                  const depth = hashes.length;
                  counters.map((val, idx) => {
                    if (idx === depth - 1) counters.splice(idx, 1, val + 1);
                    else if (idx >= depth) counters.splice(idx, 1, 0);
                  });
                  let numbering = counters.slice(0, depth).join('.') + '.';
                  let newSlug = slugify(`${numbering} ${pureTitle}`);
                  
                  localFileMap[`#${oldSlug}`] = `#${newSlug}`;
                }
              });

              // Reset structural counter depth matrix for the actual rewrite injection pass
              counters.fill(0);

              let updatedLines = lines.map(line => {
                const match = line.match(/^(#{1,6})[ \t]+(.*)$/);
                if (match) {
                  const hashes = match.at(1);
                  let title = match.at(2).trim();

                  // Strip old numbers (Clean off any previously injected numbering systems (e.g., 1.2.3.))
                  title = title.replace(/^[0-9]+(\.[0-9]+)*\.?[ \t]+/, '');

                  // STRIP LATEX MATH STRINGS TEMPORARILY JUST FOR BLANK/IGNORE CHECKS
                  let plainText = title
                    .replace(/\$\$/g, '')
                    .replace(/\\textcolor\{[a-zA-Z]+\}/g, '')
                    .replace(/\\space/g, '')
                    .replace(/\\&/g, '')
                    .replace(/[\{\}]/g, '')
                    .trim();

                  // Only skip if the heading is completely blank after stripping syntax
                  if (plainText === '') return line;
                  if (ignoredHeadings.some(ignored => plainText.toLowerCase() === ignored.toLowerCase())) {
                    return hashes + ' ' + title;
                  }

                  const depth = hashes.length;
                  counters.map((val, idx) => {
                    if (idx === depth - 1) counters.splice(idx, 1, val + 1);
                    else if (idx >= depth) counters.splice(idx, 1, 0);
                  });

                  let numbering = counters.slice(0, depth).join('.') + '.';
                  return hashes + ' ' + numbering + ' ' + title;
                }

                // 🌐 REPAIR BOTH INTERNAL AND EXTERNAL MARKDOWN ANCHOR LINKS
                let alteredLine = line;
                
                // First pass: Resolve global cross-file link dependencies
                Object.keys(globalLinkMaps).forEach(globalTarget => {
                  const destinationAnchor = globalLinkMaps[globalTarget];
                  const escapedGlobalTarget = globalTarget.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                  const crossLinkRegex = new RegExp(`\\]\\(${escapedGlobalTarget}\\)`, 'g');
                  alteredLine = alteredLine.replace(crossLinkRegex, `](${destinationAnchor})`);
                });

                // Second pass: Resolve local file-level links contextually
                Object.keys(localFileMap).forEach(localTarget => {
                  const destinationAnchor = localFileMap[localTarget];
                  const escapedLocalTarget = localTarget.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                  const localLinkRegex = new RegExp(`\\]\\(${escapedLocalTarget}\\)`, 'g');
                  alteredLine = alteredLine.replace(localLinkRegex, `](${destinationAnchor})`);
                });

                return alteredLine;
              });

              fs.writeFileSync(file, updatedLines.join('\n'), 'utf8');
            } catch (err) {
              console.error(`Error applying changes to file ${file}:`, err.message);
            }
          });
          EOF

          # Run the cross-reference processing engine
          node parse-headings.js
          rm parse-headings.js

          # 2- Loop through files a second time to parse those newly numbered headers into the TOC
          # Uses npx to run markdown-toc safely without a marketplace action wrapper
          # It updates every markdown file in place (-i) matching your placeholder
          # Resolves error 1: Added '-y' to npx to skip the interactive installer block
          # 🛠️ THE CRASH FIX: Loop through each markdown file individually. 
          # The "|| true" statement forces the script to ignore empty wiki pages instead of crashing!
          for file in *.md; do
            if [ -f "$file" ]; then
              echo "Processing Table of Contents for: $file"
              # 🏷️ Added global heading exclusions using the --ignore flag
              npx -y markdown-toc -i "$file" --ignore "$GLOBAL_IGNORED_HEADINGS" || true
              
              # 🧹 THE ULTIMATE GHOST BUSTER FIX: 
              # Instantly deletes any empty list entries matching '* [](#)' or whitespace variants generated by markdown-toc
              sed -i -E '/^[[:space:]]*\*[[:space:]]*\[\]\(#\)[[:space:]]*$/d' "$file"
              
              # 🛠️ THE PLAIN-TEXT TOC FIX: Cleans the internal text inside links generated by markdown-toc
              # This strips math syntax elements only inside the [anchor text] sections of the TOC block
              sed -i -E '/^[[:space:]]*\*/s/\\textcolor\{[a-zA-Z]+\}//g' "$file"
              sed -i -E '/^[[:space:]]*\*/s/\\space//g' "$file"
              sed -i -E '/^[[:space:]]*\*/s/\\&/\&/g' "$file"
              sed -i -E '/^[[:space:]]*\*/s/\$\$//g' "$file"
              sed -i -E '/^[[:space:]]*\*/s/\{([a-zA-Z0-9[:space:]_&-]+)\}/\1/g' "$file"
            fi
          done

      - name: Automatically Build Global TOC for _Sidebar.md
        run: |
          cd wiki-repo
          
          # Start with a clean sidebar header
          echo "### 🗺️ Navigation" > _Sidebar.md
          echo "" >> _Sidebar.md
          
          # Loop through all markdown files and extract clean link titles
          for file in *.md; do
            # Ignore hidden files, the sidebar itself, and Home page (handled below)
            # ⏬ "$file" != "_*" means it COMPLETELY IGNORES "_Sidebar.md" automatically!

            if [[ "$file" != "_*" && "$file" != "Home.md" && "$file" != "_Sidebar.md" && -f "$file" ]]; then
              name="${file%.md}"
              
              # Keeps the sidebar sync rule aligned with the shared env variable as well!
              if [[ "$name" =~ ^($GLOBAL_IGNORED_HEADINGS|_Sidebar)$ ]]; then
                echo "Skipping sidebar link for: $file"
                continue
              fi
              
              # Replaces hyphens with spaces for a cleaner display title
              display_name=$(echo "$name" | tr '-' ' ')
              echo "* [[$display_name|$name]]" >> _Sidebar.md
            fi
          done
          
          # Always pin Home to the top of your links
          if [ -f "Home.md" ]; then
            sed -i "2i * [[Home]]" _Sidebar.md
          fi

          # 🧹 THE PLAIN-TEXT SIDEBAR FIX:
          # This cleans any rogue LaTeX syntax out of the displayed text portion of the wiki link brackets [[Display|Link]]
          sed -i -E 's/\\textcolor\{[a-zA-Z]+\}//g' _Sidebar.md
          sed -i -E 's/\\space//g' _Sidebar.md
          sed -i -E 's/\\&/\&/g' _Sidebar.md
          sed -i -E 's/\$\$//g' _Sidebar.md
          # Clean up any accidental double spaces left behind after stripping keywords
          sed -i -E 's/\{([a-zA-Z0-9[:space:]_&-]+)\}/\1/g' _Sidebar.md
          sed -i -E 's/[[:space:]]+/ /g' _Sidebar.md

      - name: Commit and Push Changes back to Wiki Webpage
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "docs: auto-generate table of contents and repair cross-page references"
            git push
          else
            echo "No heading updates found. Skipping push."
          fi
